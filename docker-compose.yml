services:
  db:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Initialization container: Seeds data and generates embeddings first
  init-db:
    build:
      context: ./backend
    image: stock-backend
    working_dir: /backend
    command: >
      sh -c "
        pip install --upgrade pip &&
        pip install -r requirements.txt &&
        python manage.py makemigrations &&
        python manage.py migrate &&
        python manage.py collectstatic --noinput &&
        python manage.py seed_companies &&
        python manage.py generate_company_embeddings
      "
    volumes:
      - ./backend:/backend
      - /backend/.venv/
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./backend
    image: stock-backend
    working_dir: /backend
    command: uvicorn Stock.asgi:application --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/backend
      - /backend/.venv/
    ports:
      - "8000:8000"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      init-db:
        condition: service_completed_successfully

  celery-worker:
    build:
      context: ./backend
    image: stock-backend
    working_dir: /backend
    command: celery -A Stock worker -l info
    volumes:
      - ./backend:/backend
      - /backend/.venv/
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build:
      context: ./backend
    image: stock-backend
    working_dir: /backend
    command: celery -A Stock beat -l info
    volumes:
      - ./backend:/backend
      - /backend/.venv/
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-startup:
    build:
      context: ./backend
    image: stock-backend
    working_dir: /backend

    command:
      - sh
      - -c
      - |
        if [ ! -f /startup-data/initial_crawl_done ]; then
          echo "========================================"
          echo "Running initial 30-day pipeline..."
          echo "========================================"

          python manage.py crawl_spider sharesansar_prices --days-back 30 &&
          python manage.py compute_behavior_summary_all_companies &&
          python manage.py crawl_spider sharesansar_news --days-back 30 &&
          python manage.py categorize_news_by_embeddings &&
          touch /startup-data/initial_crawl_done

          echo "========================================"
          echo "Initial 30-day pipeline completed."
          echo "========================================"
        else
          echo "========================================"
          echo "Initial pipeline already completed."
          echo "Skipping startup crawl."
          echo "========================================"
        fi

    volumes:
      - ./backend:/backend
      - /backend/.venv/
      - celery_startup_data:/startup-data

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      init-db:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend:/frontend
      - /frontend/node_modules/
    ports:
      - "3000:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      web:
        condition: service_started

volumes:
  postgres_data:
  celery_startup_data: